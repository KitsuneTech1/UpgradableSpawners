name: UpgradableSpawners
version: 1.1.0
main: com.kitsune.upgradablespawners.UpgradableSpawners
api-version: '1.20'
author: Kitsune
description: Right-click spawners to upgrade their radius, speed, and mob quantity
softdepend: [Vault, PlaceholderAPI]

commands:
  uspawner:
    description: Diagnostic tools for UpgradableSpawners
    usage: /uspawner [reload]
    permission: upgradablespawners.info

permissions:
  upgradablespawners.upgrade:
    description: Allows players to upgrade spawners
    default: true
  upgradablespawners.info:
    description: Allows players to view spawner info
    default: true
  upgradablespawners.admin:
    description: Admin permissions for spawner management
    default: op
    children:
      upgradablespawners.info: true
